# Tests à chaque push et pull request ; archive installable publiée en release à chaque tag v*.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: LuaJIT et Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit stockfish
      - name: Suite de tests (Stockfish de la distribution, transport en mode fork)
        run: LUAJIT="$(command -v luajit)" STOCKFISH="$(command -v stockfish)" ./scripts/test.sh
  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Archive installable
        run: ./scripts/package.sh
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/*.zip dist/*.sha256 --clobber
